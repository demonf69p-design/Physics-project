<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Thrust Engine – Science Exhibition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#d8dade;--pg:#fff;--soft:#f1f2f4;--tx:#111;--mu:#8b8f98;--ac:#c8742f;--ac2:#ff8a3d;--bk:#050505;--bd:#e3e5e9}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--pg:#0c0d0f;--soft:#1a1c20;--tx:#f2f2f2;--mu:#8b8f98;--bd:#272a30}}
:root[data-theme="dark"]{--bg:#16181c;--pg:#0c0d0f;--soft:#1a1c20;--tx:#f2f2f2;--mu:#8b8f98;--bd:#272a30}
*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Inter,system-ui,-apple-system,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{letter-spacing:-.04em;line-height:1;margin:0;font-weight:500}
.wrap{max-width:1180px;margin:0 auto}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:20px;padding:14px 22px;max-width:1180px;margin:0 auto;font-size:.85rem}
nav b{font-size:1.15rem;letter-spacing:-.03em;margin-right:auto}
nav b i{color:var(--ac);font-style:normal}
nav a{color:var(--tx);text-decoration:none;opacity:.7}nav a:hover{opacity:1}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:99px;border:0;padding:12px 22px;font:inherit;font-size:.9rem;cursor:pointer;background:var(--bk);color:#fff;text-decoration:none;transition:transform .25s}
.pill:hover{transform:translateY(-2px)}.pill.g{background:rgba(120,125,135,.35);color:var(--tx)}.pill.w{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
.pill.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.hide-m{display:inline}
@media(max-width:760px){nav a.hm{display:none}}
.hero{position:relative;overflow:hidden;border-radius:0 0 0 0;min-height:640px;background:linear-gradient(180deg,#dfe1e5,#c9ccd2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(180deg,#1e2126,#0f1114)}}
.hero .wrap{position:relative;padding:50px 22px 190px;display:grid;gap:30px;grid-template-columns:1.2fr 1fr;align-items:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}}
.lbl{font-size:.75rem;border-left:2px solid var(--tx);padding-left:8px;margin-bottom:18px;display:block}
.hero h1{font-size:clamp(2.8rem,8vw,5.6rem)}
.hero h1 em{font-style:normal;color:var(--ac)}
.rate0{display:flex;gap:10px;align-items:center;margin:22px 0;font-size:.85rem;color:var(--mu)}.rate0 b{color:var(--ac);letter-spacing:2px}
.bigtxt{position:absolute;left:0;right:0;bottom:-.17em;text-align:center;font-size:clamp(7rem,28vw,22rem);font-weight:700;letter-spacing:-.06em;line-height:1;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(120,125,135,.1));-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none;user-select:none}
.engcard{background:var(--bk);border-radius:28px;padding:10px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.engcard canvas{width:100%;height:auto;aspect-ratio:10/6;display:block;border-radius:20px;transform:scaleX(-1)}
.engcard small{position:absolute;left:24px;bottom:20px;color:#fff;font-size:1.1rem;letter-spacing:-.03em}
.sbar{position:absolute;bottom:26px;left:22px;right:22px;display:flex;justify-content:space-between;gap:10px;font-size:.78rem;z-index:2}
